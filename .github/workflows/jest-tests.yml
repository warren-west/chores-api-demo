name: Run Jest tests

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    name: Jest tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        env:
          CI: true
        run: |
          # Prefer npm test (expects a test script). If you don't have one, replace this with: npx jest --runInBand
          npm test -- --ci --coverage